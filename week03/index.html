<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 03</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 03 - Question 01</p>
        </header>

        <!-- Plant Image -->
        <section class="plant-section">

            <img
                src="images/mahogani.jpg"
                alt="Mahogany (Swietenia macrophylla)"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                Which animals
                are known to feed on mahogany fruits?
            </h2>

            <p class="question-description">
                <i>Swietenia macrophylla</i>, commonly known as
                <strong>mahogany</strong>, produces large woody fruits
                containing winged seeds.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. Birds, bats and butterflies
            </button>

            <button class="answer-option" data-answer="B">
                B. Squirrels, monkeys, lutungs and macaques
            </button>

            <button class="answer-option" data-answer="C">
                C. Deer, rabbits and wild boars
            </button>

            <button class="answer-option" data-answer="D">
                D. Elephants, tapirs and snakes
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="js/script_w3.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
