
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 03</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 03 - Question 02</p>
        </header>

        <!-- Plant Image -->
        <section class="plant-section">

            <img
                src="images/kelicap_belukar.jpg"
                alt="Kelicap Belukar (Anthreptes singalensis)"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                According to the FRIM publication, which combination
                of physical characteristics describes the male
                ruby-cheeked sunbird?
            </h2>

            <p class="question-description">
                The ruby-cheeked sunbird
                (<i>Anthreptes singalensis</i>) belongs to the
                <i>Nectariniidae</i> family.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. Dark head, red cheeks and metallic green body
            </button>

            <button class="answer-option" data-answer="B">
                B. Yellow head, blue cheeks and brown body
            </button>

            <button class="answer-option" data-answer="C">
                C. White head, black cheeks and grey body
            </button>

            <button class="answer-option" data-answer="D">
                D. Green head, yellow cheeks and red body
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="js/script_w3.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
