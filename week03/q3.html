
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 03</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 03 - Question 03</p>
        </header>

        <!-- Plant Image -->
        <section class="plant-section">

            <img
                src="images/musilaj.jpg"
                alt="Okra (Abelmoschus esculentus)"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                According to the FRIM publication, which part of
                the <i>bendi</i> contains water-soluble fibre
                (polysaccharides)?
            </h2>

            <p class="question-description">
                <i>Abelmoschus esculentus</i> (L.) Moench, commonly known as
                <strong>bendi, okra or lady's finger</strong>.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. Exocarp
            </button>

            <button class="answer-option" data-answer="B">
                B. Mesocarp
            </button>

            <button class="answer-option" data-answer="C">
                C. Locule
            </button>

            <button class="answer-option" data-answer="D">
                D. Mucilage
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="js/script_w3.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
