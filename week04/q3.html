
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 04</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 04 - Question 03</p>
        </header>

        <!-- Plant Image -->
        <section class="plant-section">

            <img
                src="images/MerbauIpil.jpg"
                alt="Merbau ipil (Intsia bijuga)"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                What is the maximum height that a merbau ipil
                tree can reach?
            </h2>

            <p class="question-description">
                <i>Intsia bijuga</i>, commonly known as
                <strong>merbau ipil</strong>, is a small to
                medium-sized tree found in lowland areas.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. 10 metres
            </button>

            <button class="answer-option" data-answer="B">
                B. 15 metres
            </button>

            <button class="answer-option" data-answer="C">
                C. 20 metres
            </button>

            <button class="answer-option" data-answer="D">
                D. 25 metres
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="js/script_w4.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
