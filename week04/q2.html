
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 04</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 04 - Question 02</p>
        </header>

        <!-- Bird Image -->
        <section class="plant-section">

            <img
                src="images/KelicapKunyit.jpg"
                alt="Common iora (Aegithina tiphia)"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                Which of the following describes the plumage
                of the common iora?
            </h2>

            <p class="question-description">
                <i>Aegithina tiphia</i>, commonly known as
                <strong>common iora</strong> or
                <strong>kelicap kunyit</strong>, is a bird
                found in open forests and plantations.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. Yellowish-green plumage with black and white wing markings
            </button>

            <button class="answer-option" data-answer="B">
                B. Bright red plumage with blue wing markings
            </button>

            <button class="answer-option" data-answer="C">
                C. Completely black plumage with a white belly
            </button>

            <button class="answer-option" data-answer="D">
                D. Brown plumage with orange wing markings
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="js/script_w4.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
