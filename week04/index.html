
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 04</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 04 - Question 01</p>
        </header>

        <!-- Plant Image -->
        <section class="plant-section">

            <img
                src="images/PayaLaut.jpg"
                alt="Mangrove forest zonation"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                What is the main factor used to classify
                mangrove forest zones?
            </h2>

            <p class="question-description">
                Mangrove forest zones are classified according
                to the frequency of tidal flooding, which
                influences the distribution of mangrove species.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. Soil temperature
            </button>

            <button class="answer-option" data-answer="B">
                B. Frequency of tidal flooding
            </button>

            <button class="answer-option" data-answer="C">
                C. Amount of annual rainfall
            </button>

            <button class="answer-option" data-answer="D">
                D. Height of mangrove trees
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="js/script_w4.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
