
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 02</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 02 - Question 01</p>
        </header>

        <!-- Plant Image -->
        <section class="plant-section">

            <img
                src="images/sekentut.jpg"
                alt="Sekentut (Paederia foetida L.)"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                According to the FRIM publication, which of the
                following conditions is listed under the medicinal
                uses of <i>Paede1ria foetida</i> L.?
            </h2>

            <p class="question-description">
                <i>Paederia foetida</i> L., also known as
                <strong>sekentut</strong>, is featured in the FRIM
                publication <i>Ulaman &amp; Herba Masakan di FRIM</i>.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. Bloating and intestinal discomfort
            </button>

            <button class="answer-option" data-answer="B">
                B. Tooth decay
            </button>

            <button class="answer-option" data-answer="C">
                C. Blurred vision
            </button>

            <button class="answer-option" data-answer="D">
                D. Hearing loss
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="../week02/script_w2.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
