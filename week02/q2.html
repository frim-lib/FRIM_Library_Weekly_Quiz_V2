
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 02</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 02 - Question 02</p>
        </header>

        <!-- Plant Image -->
        <section class="plant-section">

            <img
                src="images/Legundi.jpg"
                alt="Legundi (Vitex negundo L.)"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                What is the scientific name of legundi?
            </h2>

            <p class="question-description">
                According to the FRIM publication
                <i>Ulaman &amp; Herba Masakan di FRIM</i>,
                legundi belongs to the <i>Lamiaceae</i> family.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. <i>Parkia speciosa</i> Hassk.
            </button>

            <button class="answer-option" data-answer="B">
                B. <i>Vitex negundo</i> L.
            </button>

            <button class="answer-option" data-answer="C">
                C. <i>Centella asiatica</i> (L.) Urb.
            </button>

            <button class="answer-option" data-answer="D">
                D. <i>Morinda citrifolia</i> L.
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="../week02/script_w2.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
