
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 02</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM LIBRARY WEEKLY QUIZ</h1>
            <p>Week 02 - Question 03</p>
        </header>

        <!-- Plant Image -->
        <section class="plant-section">

            <img
                src="images/JandaMerana.jpg"
                alt="Janda merana (Salix babylonica)"
                class="plant-image"
            >

        </section>

        <!-- Question -->
        <section class="question-section">

            <h2>
                According to the FRIM publication, what is the
                maximum height mentioned for <i>Salix babylonica</i> known
                as janda merana?

            </h2>

            <p class="question-description">
                <i>Salix babylonica</i>, commonly known as
                <strong>janda merana</strong>, is described in the
                FRIM publication
                <i>Ulaman &amp; Herba Masakan di FRIM</i>.
            </p>

        </section>

        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. 5 metres
            </button>

            <button class="answer-option" data-answer="B">
                B. 8 metres
            </button>

            <button class="answer-option" data-answer="C">
                C. 10 metres
            </button>

            <button class="answer-option" data-answer="D">
                D. 15 metres
            </button>

        </section>

        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>

    <script src="../week02/script_w2.js"></script>
    <script src="../js/button_sound.js"></script>

</body>
</html>
